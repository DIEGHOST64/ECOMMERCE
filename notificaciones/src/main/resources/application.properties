spring.application.name=notificaciones
server.port=${SERVER_PORT:9093}

# RabbitMQ (reemplazo de AWS SQS)
spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USERNAME:guest}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:guest}

# Reintentos y DLQ: tras 3 intentos el mensaje se envia a la cola de errores.
spring.rabbitmq.listener.simple.retry.enabled=true
spring.rabbitmq.listener.simple.retry.max-attempts=3
spring.rabbitmq.listener.simple.retry.initial-interval=1s
spring.rabbitmq.listener.simple.retry.multiplier=2
spring.rabbitmq.listener.simple.retry.max-interval=10s
spring.rabbitmq.listener.simple.default-requeue-rejected=false

# Colas y exchanges
app.notificaciones.exchange=${NOTIFICACIONES_EXCHANGE:notificaciones.exchange}
app.notificaciones.queue=${NOTIFICACIONES_QUEUE:notificaciones.queue}
app.notificaciones.dlx=${NOTIFICACIONES_DLX:notificaciones.dlx}
app.notificaciones.dlq=${NOTIFICACIONES_DLQ:notificaciones.dlq}

# Email por SMTP (Mailpit en desarrollo: localhost:1025)
spring.mail.host=${MAIL_HOST:localhost}
spring.mail.port=${MAIL_PORT:1025}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:false}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_STARTTLS:false}
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

app.mail.from=${MAIL_FROM:no-reply@ecommerce.local}
app.mail.from-name=${MAIL_FROM_NAME:E-Commerce}

# SMS: "log" (desarrollo) o "webhook" (Jasmin, Kannel, gateway Android, etc.)
app.sms.provider=${SMS_PROVIDER:log}
app.sms.webhook.url=${SMS_WEBHOOK_URL:}
app.sms.webhook.token=${SMS_WEBHOOK_TOKEN:}
app.sms.webhook.connect-timeout-ms=${SMS_WEBHOOK_CONNECT_TIMEOUT_MS:3000}
app.sms.webhook.read-timeout-ms=${SMS_WEBHOOK_READ_TIMEOUT_MS:5000}

# Actuator (healthcheck de Docker)
management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true
