name: CI

on:
  push:
    branches: [main, 'refactor/**']
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    name: Backend (${{ matrix.service }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service:
          - auth/auth/auth
          - catalogo/catalogo
          - notificaciones
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
          cache-dependency-path: ${{ matrix.service }}/pom.xml

      - name: Compilar y probar
        working-directory: ${{ matrix.service }}
        run: |
          chmod +x mvnw
          ./mvnw -B clean verify

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci --no-audit --no-fund

      - name: Pruebas
        run: npm test -- --watchAll=false
        env:
          CI: 'true'

      - name: Build de produccion
        run: npm run build
        env:
          CI: 'true'

  compose:
    name: Docker Compose
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validar docker-compose.yml
        run: |
          cp .env.example .env
          docker compose config -q
